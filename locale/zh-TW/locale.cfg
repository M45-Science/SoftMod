; rules tab strings
info_rules_header=伺服器規則 - 違反規則，[entity=behemoth-biter] 就會找上你！
info_rule1=別惡意搗亂。請運用常識。
info_rule2=別煩管理員。請先嘗試 /banish 或 #moderation-help 頻道。
info_rule3=禁止廣告與自我宣傳，加密貨幣及邀請連結請至他處。
info_rule4=遇到玩家問題？請先使用 /banish。
info_rule5=這不是你的私人伺服器。請互相妥協，或改玩單人模式。
info_rule6=這裡的一切都是公開的。請遵守公開伺服器的規則。
info_rule7=提問前請先閱讀資訊分頁與說明頻道。
